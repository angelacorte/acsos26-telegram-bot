name: CI/CD
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    paths-ignore:
      - '.gitignore'
      - '.mergify.yml'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'README.md'
      - 'renovate.json'
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing tag to publish again, for example 1.3.0
        required: false
        type: string
        default: ''

jobs:
  dispatcher:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
      || startsWith(github.head_ref, 'refs/heads/dependabot/')
    steps:
      - run: 'true'
  ci-cd:
    permissions:
      contents: write
    needs:
      - dispatcher
    uses: ./.github/workflows/build-and-deploy.yml
    with:
      release_version: ${{ inputs.release_version }}
    secrets: inherit
