name: CI/CD Process
on:
  workflow_call:
    inputs:
      release_version:
        description: Existing semantic version to republish
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing tag to publish again, for example 1.3.0
        required: false
        type: string
        default: ''

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-2025, macos-15, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-${{ github.workflow }}-${{ matrix.os }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.30
      - uses: DanySK/build-check-deploy-gradle-action@4.0.30
        with:
          should-run-codecov: ${{ runner.os == 'Linux' }}
          should-deploy: false
  containerize:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: bot
            dockerfile: Dockerfile
            image: angelacortecchia/acsos26-telegram-bot
          - name: llm
            dockerfile: llm_service/Dockerfile
            image: angelacortecchia/acsos26-telegram-bot-llm
    concurrency:
      group: container-${{ matrix.name }}-${{ github.workflow }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Build ${{ matrix.name }} container
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "${{ matrix.image }}:ci"
          .
  release:
    outputs:
      version: ${{ steps.release-version.outputs.value }}
    permissions:
      contents: write
    concurrency:
      # Only one release job at a time. Strictly sequential.
      group: release-${{ github.workflow }}-${{ github.event.number || github.ref }}
    needs:
      - build
      - containerize
    runs-on: ubuntu-latest
    if: >-
      !github.event.repository.fork
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Find the version of Node from package.json
        id: node-version
        run: echo "version=$(jq -r .engines.node package.json)" >> $GITHUB_OUTPUT
      - name: Install Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - name: Install release dependencies
        run: npm ci
      - name: Create semantic release
        id: semantic-release
        if: inputs.release_version == ''
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore an existing GitHub release
        if: inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            echo "Tag $RELEASE_VERSION does not exist" >&2
            exit 1
          fi
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_VERSION"
          fi
      - name: Resolve release version
        id: release-version
        env:
          AUTOMATIC_VERSION: ${{ steps.semantic-release.outputs.version }}
          MANUAL_VERSION: ${{ inputs.release_version }}
        run: |
          version="${MANUAL_VERSION:-$AUTOMATIC_VERSION}"
          if [ -n "$version" ]; then
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
              echo "Invalid release version: $version" >&2
              exit 1
            fi
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
  publish-images:
    permissions:
      contents: read
    needs:
      - release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: bot
            dockerfile: Dockerfile
            image: angelacortecchia/acsos26-telegram-bot
          - name: llm
            dockerfile: llm_service/Dockerfile
            image: angelacortecchia/acsos26-telegram-bot-llm
    steps:
      - name: Checkout release ${{ needs.release.outputs.version }}
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.release.outputs.version }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: angelacortecchia
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      - name: Publish ${{ matrix.name }} image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          docker build \
            --file "$DOCKERFILE" \
            --tag "$IMAGE:$RELEASE_VERSION" \
            --tag "$IMAGE:latest" \
            .
          docker push "$IMAGE:$RELEASE_VERSION"
          docker push "$IMAGE:latest"
  success:
    runs-on: ubuntu-24.04
    needs:
      - release
      - publish-images
      - build
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
