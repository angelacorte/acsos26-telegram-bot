name: CI/CD Process
on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-2025, macos-15, ubuntu-24.04 ]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: build-${{ github.workflow }}-${{ matrix.os }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: DanySK/action-checkout@0.2.30
      - uses: DanySK/build-check-deploy-gradle-action@4.0.30
        with:
          should-run-codecov: ${{ runner.os == 'Linux' }}
          should-deploy: false
  containerize:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: bot
            dockerfile: Dockerfile
            image: angelacortecchia/acsos26-telegram-bot
          - name: llm
            dockerfile: llm_service/Dockerfile
            image: angelacortecchia/acsos26-telegram-bot-llm
    concurrency:
      group: container-${{ matrix.name }}-${{ github.workflow }}-${{ github.event.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
      - name: Build ${{ matrix.name }} container
        run: >-
          docker build
          --file "${{ matrix.dockerfile }}"
          --tag "${{ matrix.image }}:ci"
          .
  release:
    permissions:
      contents: write
    concurrency:
      # Only one release job at a time. Strictly sequential.
      group: release-${{ github.workflow }}-${{ github.event.number || github.ref }}
    needs:
      - build
      - containerize
    runs-on: ubuntu-latest
    if: >-
      !github.event.repository.fork
      && (
        github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          token: ${{ github.token }}
      - name: Find the version of Node from package.json
        id: node-version
        run: echo "version=$(jq -r .engines.node package.json)" >> $GITHUB_OUTPUT
      - name: Install Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: npm
      - name: Install release dependencies
        run: npm ci
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: angelacortecchia
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
      - name: Create GitHub release and publish Docker images
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
  success:
    runs-on: ubuntu-24.04
    needs:
      - release
      - build
    if: >-
      always() && (
        contains(join(needs.*.result, ','), 'failure')
        || !contains(join(needs.*.result, ','), 'cancelled')
      )
    steps:
      - name: Verify that there were no failures
        run: ${{ !contains(join(needs.*.result, ','), 'failure') }}
